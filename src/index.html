
<!DOCTYPE html>

    <!-- URL officielle -->

    <!-- Open Graph : WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website"/>

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Union Garage de Ratoma | Gestion automobile"/>
    <meta name="twitter:description" content="Une plateforme professionnelle pour gérer les activités de votre garage automobile."/>
    <meta name="twitter:image" content="https://uniongarageratoma.com/image/og-image.jpg"/>
    <meta name="twitter:image:alt" content="Union Garage de Ratoma — plateforme de gestion automobile"/>

    <!-- Favicon et icônes -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="icon" type="image/png" sizes="192x192" href="/image/icon-192.png"/>

    <link rel="apple-touch-icon" sizes="180x180" href="/image/icon-192.png"/>

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json"/>

    <!-- Préconnexion aux polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>

    <!-- Styles critiques -->
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        background-color: #f9fafb;
        color: #111827;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .loading-spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(
          135deg,
          #22c55e 0%,
          #16a34a 100%
        );
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      input,
      select,
      textarea {
        font-size: 16px;
      }

      button,
      a,
      [role="button"] {
        min-height: 44px;
        min-width: 44px;
      }
    </style>
  </head>

  <body>
    <!-- Chargement initial -->
    <div id="loading" class="loading-spinner">
      <div class="spinner"></div>
    </div>

    <!-- Application Angular -->
    <app-root>
      <div class="fallback-content">
        <h1>Union Garage de Ratoma</h1>
        <p>Plateforme de gestion automobile.</p>
        <p>Veuillez activer JavaScript pour utiliser l'application.</p>
      </div>
    </app-root>

    <!-- Masquer le chargement après le chargement initial -->
    <script>
      window.addEventListener("load", function () {
        const loading = document.getElementById("loading");

        if (loading) {
          loading.style.opacity = "0";

          setTimeout(() => {
            loading.style.display = "none";
          }, 300);
        }
      });
    </script>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
